name: Deploy Production (filtered)

on:
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  check-repo:
    runs-on: ubuntu-latest
    outputs:
      is_production: ${{ steps.check.outputs.is_production }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.repository }}" == *"-production" ]]; then
            echo "is_production=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_production=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-repo
    if: needs.check-repo.outputs.is_production == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Hops is now LIVE on production (canonical page: products/hops.html).
      # The former "Remove hidden pages" step stripped Hops files/nav/sitemap from
      # prod and left products/hops.html half-broken (CSS/JS deleted). Removed so
      # prod mirrors staging. Re-add a filter step here if a page must be hidden again.

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
