name: Gated Production Deploy

# BLESSED deploy path (D-01/D-02): manual trigger only.
# Break-glass bypass: `git push production main --force` still exists for emergencies
# but bypasses tests, CNAME guard, tagging, and runbook entry.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this production deploy (appears in RUNBOOK.md)'
        required: false
        default: ''

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Middleware tests (mirrors tests.yml exactly -- no E2E)
  # -------------------------------------------------------------------------
  test-middleware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: zoho-middleware
      - run: npm test
        working-directory: zoho-middleware
      - name: Lint middleware
        run: npm run lint
        working-directory: zoho-middleware
      - name: Audit middleware dependencies
        run: npm audit --audit-level=high --omit=dev
        working-directory: zoho-middleware

  # -------------------------------------------------------------------------
  # Job 2: Frontend tests (mirrors tests.yml exactly -- no E2E)
  # -------------------------------------------------------------------------
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high --omit=dev

  # -------------------------------------------------------------------------
  # Job 3: Deploy -- only runs when BOTH test jobs pass (D-03)
  # -------------------------------------------------------------------------
  deploy:
    needs: [test-middleware, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # a. Checkout with full history and all tags.
      # persist-credentials: false is CRITICAL. By default actions/checkout writes an
      # http.https://github.com/.extraheader credential that applies to EVERY github.com
      # URL and OVERRIDES the token embedded in an explicit push URL. That makes it
      # impossible to push to two different repos (staging + production) with two
      # different tokens. With persistence off, each push below authenticates via its
      # own embedded x-access-token, so staging uses GITHUB_TOKEN and production uses
      # the prod-scoped PROD_DEPLOY_TOKEN (keeps T-33-09 scope tight).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # a2. Point origin at a GITHUB_TOKEN-authenticated URL so staging pushes
      # (prod tag, RUNBOOK row, CNAME restore) succeed. GITHUB_TOKEN has contents:write
      # on this repo via the job `permissions:` block. Production pushes use their own
      # explicit PROD_DEPLOY_TOKEN URLs and never rely on origin.
      - name: Configure origin auth for staging pushes
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      # b. CNAME pre-flight guard (Pitfall 3 / T-33-07)
      # If CNAME is already steinsandvines.ca, a previous deploy got stuck
      # mid-swap. Abort immediately to prevent pushing the wrong domain.
      - name: CNAME pre-flight guard
        run: |
          CURRENT_CNAME=$(cat CNAME)
          echo "Current CNAME value: ${CURRENT_CNAME}"
          if [ "$CURRENT_CNAME" = "steinsandvines.ca" ]; then
            echo "ERROR: CNAME is already 'steinsandvines.ca'."
            echo "A previous deploy may have gotten stuck mid-swap."
            echo "Fix: manually restore CNAME to 'staging.steinsandvines.ca', commit [skip ci], and push."
            exit 1
          fi
          echo "CNAME pre-flight passed: ${CURRENT_CNAME} (not production value)"

      # c. Capture the deploy SHA (the reviewed staging HEAD) BEFORE any CNAME swap.
      # This is the commit we tag and record. It is identical on staging and is the
      # parent of the prod-CNAME commit in production history, so the tag resolves on
      # both repos.
      - name: Capture deploy SHA
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploy SHA: ${SHORT_SHA}"

      # d. Promote to production: swap CNAME to the production value, force-push the
      # tree, then immediately reset the swap commit away locally. Production ends with
      # CNAME=steinsandvines.ca; origin/staging NEVER receives a prod-CNAME commit, so
      # no restore step (and no fragile mid-swap window) is needed. If the force-push
      # fails, `set -e` aborts here and every downstream step is skipped (if: success()),
      # so a failed deploy writes nothing to staging.
      #
      # CRITICAL: the commit message MUST NOT contain [skip ci] / [ci skip].
      # The production repo publishes GitHub Pages via deploy-production.yml, which
      # triggers on `push: branches:[main]`. GitHub honors a skip-ci token anywhere in
      # the HEAD commit message and would skip that workflow — so the new frontend would
      # land in the repo but never publish to the live site (silent stale-frontend bug).
      # The redundant production-side Tests/Enforce-CNAME runs this push also triggers
      # are expected and harmless.
      - name: Force-push to production repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          STAGING_SHA=$(git rev-parse HEAD)
          echo "steinsandvines.ca" > CNAME
          git add CNAME
          git commit -m "chore: set CNAME to steinsandvines.ca for production deploy"
          git push https://x-access-token:${{ secrets.PROD_DEPLOY_TOKEN }}@github.com/koa-inn/steins-and-vines-production.git HEAD:main --force
          echo "Force-push to production complete"
          git reset --hard "${STAGING_SHA}"
          echo "Local tree reset to staging HEAD (${STAGING_SHA}) -- origin unaffected by the CNAME swap"

      # e. Railway middleware deploy note
      # Approach A (primary): Railway auto-deploys via watchPatterns = ["zoho-middleware/**"]
      # in railway.toml. Enable "Wait for CI" in Railway Service Settings so Railway
      # holds the auto-triggered deploy in WAITING state until this workflow's checks pass.
      # If tests fail, Railway marks the deploy SKIPPED -- middleware never redeploys.
      #
      # Approach B (fallback if A is flaky due to extra check suites):
      #   1. Dashboard -> Service Settings -> disable GitHub autodeploy
      #   2. Add: railway up --service sv_middleware --ci
      #      with env: RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # See docs/RUNBOOK.md Human Prerequisites for Railway "Wait for CI" toggle setup.
      - name: Railway deploy note (Approach A -- Wait for CI)
        run: |
          echo "Railway middleware auto-deploys via watchPatterns on the force-push above."
          echo "Ensure 'Wait for CI' is enabled in Railway Service Settings for sv_middleware."
          echo "See docs/RUNBOOK.md Human Prerequisites if Railway skips or never deploys."

      # -----------------------------------------------------------------------
      # CRITICAL ORDERING (DEPLOY-02):
      # Steps f, g, h (Railway deploy ID, tag, runbook append) run with the default
      # `if: success()`, so they fire ONLY after the force-push in step (d) succeeded
      # -- a failed force-push records nothing. Because they run BEFORE the smoke-check
      # (step i), a later smoke-check failure does NOT undo them: every deploy that
      # actually reached production is recorded, including one whose health gate fails.
      # -----------------------------------------------------------------------

      # f. Capture Railway deploy ID (SHA was captured pre-swap in step c)
      - name: Capture Railway deploy ID
        id: railway
        if: success()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          DEPLOY_ID="unknown"
          if [ -n "${RAILWAY_TOKEN}" ]; then
            if command -v railway &>/dev/null; then
              DEPLOY_ID=$(railway deployment list --service sv_middleware --json --limit 1 2>/dev/null | jq -r '.[0].id // "unknown"' 2>/dev/null || echo "unknown")
            else
              echo "WARNING: railway CLI not found -- installing..."
              npm install -g @railway/cli 2>/dev/null || true
              DEPLOY_ID=$(railway deployment list --service sv_middleware --json --limit 1 2>/dev/null | jq -r '.[0].id // "unknown"' 2>/dev/null || echo "unknown")
            fi
          else
            echo "WARNING: RAILWAY_TOKEN secret is not set. Set it in repo secrets to capture deploy IDs."
          fi
          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
          echo "Railway Deploy ID: ${DEPLOY_ID}"

      # g. Tag: prod-YYYYMMDD-N (only after a successful force-push)
      - name: Create prod tag
        if: success()
        run: |
          TODAY=$(date -u +%Y%m%d)
          EXISTING=$(git tag -l "prod-${TODAY}-*" | wc -l | tr -d ' ')
          N=$((EXISTING + 1))
          TAG_NAME="prod-${TODAY}-${N}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"

          echo "Creating annotated tag: ${TAG_NAME} -> ${SHORT_SHA}"
          git tag -a "${TAG_NAME}" "${SHORT_SHA}" -m "Production deploy ${TAG_NAME}: ${SHORT_SHA}"

          git push origin "${TAG_NAME}"
          git push https://x-access-token:${{ secrets.PROD_DEPLOY_TOKEN }}@github.com/koa-inn/steins-and-vines-production.git "${TAG_NAME}"

          echo "Tag ${TAG_NAME} pushed to both remotes"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"

      # h. Runbook append: write deploy history row BEFORE the smoke-check, so a deploy
      # that reached production but later fails its health gate is still recorded
      # (DEPLOY-02). Runs only on success() -- i.e. only after the force-push succeeded.
      - name: Append deploy history to RUNBOOK.md
        if: success()
        env:
          # Pass the user-supplied reason via env (never interpolate ${{ }} straight
          # into the shell) to avoid command injection, then strip newlines and pipes
          # so it cannot break out of or corrupt the Markdown table row.
          REASON_RAW: ${{ github.event.inputs.reason }}
        run: |
          UTC_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          DEPLOY_ID="${{ steps.railway.outputs.deploy_id }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REASON=$(printf '%s' "$REASON_RAW" | tr -d '\r\n' | tr '|' '/')
          REASON="${REASON:-manual deploy via gated-deploy.yml}"

          ROW="| ${UTC_DATE} | \`${SHORT_SHA}\` | \`${DEPLOY_ID}\` | [Run](${RUN_URL}) | ${REASON} |"
          # Insert the row INTO the Deploy History table (newest first), right after that
          # table's header separator -- not at EOF (which lands outside the table). Anchor
          # on the "## Deploy History" heading so we never match the Overview table above.
          awk -v row="$ROW" '
            /^## Deploy History/ { in_dh = 1 }
            in_dh && !done && /^\|-+\|/ { print; print row; done = 1; next }
            { print }
          ' docs/RUNBOOK.md > docs/RUNBOOK.md.tmp
          mv docs/RUNBOOK.md.tmp docs/RUNBOOK.md
          # Safety net: if the table anchor ever goes missing, don't lose the record.
          if ! grep -qF "${SHORT_SHA}" docs/RUNBOOK.md; then
            echo "WARNING: deploy row not inserted into the table (anchor missing?) — appending at EOF"
            echo "${ROW}" >> docs/RUNBOOK.md
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/RUNBOOK.md
          git commit -m "chore: append deploy runbook entry [skip ci]"
          git push origin main
          echo "RUNBOOK.md updated and pushed to staging"

      # i. Smoke-check /health (runs AFTER tag + runbook are committed)
      # Hard-fail: non-200 HTTP OR redis:false
      # Soft-warn: authenticated:false (expected on Railway restart -- log only)
      # Grace window: 5 retries x 20s = max 100s for Railway cold-start
      - name: Smoke-check /health
        run: |
          HEALTH_URL="https://svmiddleware-production.up.railway.app/health"
          echo "Smoke-checking: ${HEALTH_URL}"
          echo "Grace window: 5 retries x 20s = up to 100s for Railway cold-start"

          PASSED=false
          for i in 1 2 3 4 5; do
            echo "Attempt ${i}/5: waiting 20s for Railway cold-start..."
            sleep 20

            HTTP_CODE=$(curl -s -o /tmp/health_body.json -w "%{http_code}" --max-time 15 "${HEALTH_URL}" 2>/dev/null || echo "000")
            echo "HTTP status: ${HTTP_CODE}"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Attempt ${i}/5: HTTP ${HTTP_CODE} -- not ready yet"
              continue
            fi

            REDIS=$(jq -r '.redis' /tmp/health_body.json 2>/dev/null || echo "null")
            AUTH=$(jq -r '.authenticated' /tmp/health_body.json 2>/dev/null || echo "null")
            UPTIME=$(jq -r '.uptime' /tmp/health_body.json 2>/dev/null || echo "null")
            echo "redis=${REDIS}, authenticated=${AUTH}, uptime=${UPTIME}"

            if [ "$REDIS" = "true" ]; then
              echo "SMOKE CHECK PASSED on attempt ${i}: HTTP 200, redis=true"
              PASSED=true
              break
            else
              echo "Attempt ${i}/5: redis=${REDIS} -- Redis not connected yet"
            fi
          done

          if [ "$PASSED" != "true" ]; then
            echo ""
            echo "SMOKE CHECK FAILED after 5 attempts."
            echo "Health response body:"
            cat /tmp/health_body.json 2>/dev/null || echo "(no body)"
            echo ""
            echo "Possible causes:"
            echo "  - Railway middleware did not redeploy (check Wait for CI toggle)"
            echo "  - Redis connection failed (check Railway Redis service)"
            echo "  - HTTP != 200 after all retries (check Railway logs)"
            echo ""
            echo "RUNBOOK entry and git tag were already written (DEPLOY-02 -- record persists)."
            echo "The deploy reached production but the health gate failed."
            echo "See docs/RUNBOOK.md for rollback procedures."
            exit 1
          fi

          AUTH=$(jq -r '.authenticated' /tmp/health_body.json 2>/dev/null || echo "null")
          if [ "$AUTH" = "false" ]; then
            echo ""
            echo "SMOKE CHECK WARNING: authenticated=false"
            echo "Zoho OAuth drops on every Railway restart -- this is expected."
            echo "Action required: re-authenticate Zoho at https://svmiddleware-production.up.railway.app/auth/zoho"
          fi

          echo "Smoke check complete. Production is healthy."

      # NOTE: No CNAME-restore step is needed. The prod-CNAME swap commit (step d) is
      # force-pushed to production and then reset away locally, so origin/staging never
      # holds the production CNAME. The pre-flight guard (step b) remains as a belt-and-
      # suspenders check against any externally-introduced stuck state.
