name: Update Zoho Snapshot

# Runs nightly at 6 AM UTC — 1 hour after the middleware cron warm-up (5 AM UTC)
# so Redis caches are guaranteed warm before we export. Can also be triggered manually.
#
# What it does:
#   1. Fetches /api/snapshot from the production middleware (reads warm Redis caches)
#   2. Validates the response (no error key, at least some items present)
#   3. Writes content/zoho-snapshot.json and commits if changed
#   4. This file is the last-resort static fallback for the frontend when the
#      middleware is unreachable (e.g. private browsing during a 429 outage)

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    if: github.repository == 'koa-inn/steins-and-vines-staging'
    permissions:
      contents: write       # Allow pushing the updated snapshot file

    steps:
      # persist-credentials: false is REQUIRED for the dual-repo push below. By default
      # actions/checkout writes an http.extraheader credential that applies to every
      # github.com URL and OVERRIDES the token embedded in the explicit production push
      # URL -- so the production cross-push would silently 403 as github-actions[bot]
      # every night. With persistence off, the staging push uses GITHUB_TOKEN (via the
      # origin URL set below) and the production push uses its own embedded
      # PROD_DEPLOY_TOKEN. (Same fix applied to gated-deploy.yml.)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure origin auth for staging push
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Fetch snapshot from middleware
        id: fetch
        run: |
          echo "Fetching snapshot from production middleware..."
          # /api/snapshot is behind requirePiiApiKey (server.js) since Phase 32 —
          # it reads the x-api-key header. Without it the middleware returns 403 and
          # the production snapshot silently goes stale. MW_API_KEY must equal the
          # Railway API_SECRET_KEY; set it as a repo Actions secret.
          if [ -z "${{ secrets.MW_API_KEY }}" ]; then
            echo "ERROR: MW_API_KEY secret is not set — /api/snapshot will 403."
            echo "Add it under Settings → Secrets and variables → Actions (= Railway API_SECRET_KEY)."
            exit 1
          fi

          HTTP_CODE=$(curl -s -o snapshot_raw.json -w "%{http_code}" \
            --max-time 60 \
            -H "x-api-key: ${{ secrets.MW_API_KEY }}" \
            "https://svmiddleware-production.up.railway.app/api/snapshot")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Middleware returned HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "403" ]; then
              echo "HINT: 403 means the x-api-key header was rejected — confirm MW_API_KEY matches Railway API_SECRET_KEY."
            fi
            cat snapshot_raw.json
            exit 1
          fi

          # Fail if response contains an error key
          if python3 -c "import sys,json; d=json.load(open('snapshot_raw.json')); sys.exit(1 if 'error' in d else 0)"; then
            echo "Snapshot validated OK"
          else
            echo "ERROR: Snapshot contains error field:"
            cat snapshot_raw.json
            exit 1
          fi

          # Fail if all three catalogs are empty (likely a cold cache or Zoho 429)
          python3 - <<'PYEOF'
          import json, sys
          d = json.load(open('snapshot_raw.json'))
          products    = len(d.get('products', []))
          ingredients = len(d.get('ingredients', []))
          services    = len(d.get('services', []))
          print(f"  products:     {products}")
          print(f"  ingredients:  {ingredients}")
          print(f"  services:     {services}")
          print(f"  generated_at: {d.get('generated_at', 'n/a')}")
          if products + ingredients + services == 0:
              print("ERROR: All catalogs are empty — skipping commit")
              sys.exit(1)
          PYEOF

      - name: Write snapshot file
        run: |
          # Pretty-print for readable diffs
          python3 -c "import json; d=json.load(open('snapshot_raw.json')); open('content/zoho-snapshot.json','w').write(json.dumps(d, indent=2))"
          rm snapshot_raw.json

      - name: Commit and push to both repos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/zoho-snapshot.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged — nothing to commit"
            exit 0
          fi

          # --- Staging ---
          # Staging publishes via GitHub Pages "deploy from branch" (legacy), which
          # serves the committed file directly — no Actions run is needed to make the
          # new snapshot live, so [skip ci] here just avoids a wasteful nightly CI run.
          git commit -m "chore: update Zoho snapshot [skip ci]"
          git push origin main
          echo "Snapshot pushed to staging."

          # --- Production (CNAME-safe) ---
          # Do NOT push staging's tree to production: gated-deploy.yml force-pushes
          # production main to its own history (CNAME = steinsandvines.ca), so a plain
          # cross-push of staging HEAD can't fast-forward, and a --force cross-push
          # would overwrite production's CNAME with staging's → 404. Instead, build a
          # snapshot-only commit on top of production's ACTUAL main so it fast-forwards
          # cleanly and never touches CNAME or deploy history.
          PROD_URL="https://x-access-token:${{ secrets.PROD_DEPLOY_TOKEN }}@github.com/koa-inn/steins-and-vines-production.git"
          cp content/zoho-snapshot.json /tmp/zoho-snapshot.json
          git fetch "$PROD_URL" main
          git checkout -B prod-snapshot FETCH_HEAD
          cp /tmp/zoho-snapshot.json content/zoho-snapshot.json
          git add content/zoho-snapshot.json
          if git diff --staged --quiet; then
            echo "Production snapshot already current — nothing to push to production."
          else
            # DEPLOY-04 (audit #10): NO [skip ci] here. Production publishes GitHub
            # Pages via the workflow build (deploy-production.yml, build_type:workflow),
            # so [skip ci] would land the snapshot in prod main but never republish it
            # to the live site — leaving the static fallback permanently stale. Letting
            # the deploy workflow fire republishes prod (it strips .planning and keeps
            # CNAME, since this commit is built on prod's own main via FETCH_HEAD).
            git commit -m "chore: update Zoho snapshot"
            git push "$PROD_URL" prod-snapshot:main
            echo "Snapshot pushed to production (snapshot-only commit on prod main)."
          fi
          git checkout main
