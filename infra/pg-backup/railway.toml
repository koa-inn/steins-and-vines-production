# Config for the pg-backup cron service ONLY. Railway does not follow the service's
# root directory for this file: set the service's config file path to
# /infra/pg-backup/railway.toml, or it will pick up the middleware's /railway.toml
# (including its preDeployCommand). Config-as-code stops applying 2026-12-01 — copy
# these settings into the dashboard before then (see README.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/pg-backup/Dockerfile"
watchPatterns = ["infra/pg-backup/**"]

[deploy]
# 10:00 UTC = 03:00 Pacific in summer, 02:00 in winter.
cronSchedule = "0 10 * * *"
restartPolicyType = "NEVER"
